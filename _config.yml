# GitHub Pages builds this repo with Jekyll. With no config, Jekyll turns every
# tracked Markdown file it does not blacklist into a live page on this origin
# (CLAUDE.md became /CLAUDE.html and /CLAUDE) that runs the default theme's
# scripts and carries no Content-Security-Policy, beside index.html and 404.html,
# which both carry one. Excluding Markdown keeps Jekyll's other filtering; a
# .nojekyll file would also start serving the dot paths (.gitignore,
# .tool-versions, .github/) that Jekyll drops today.
#
# Jekyll 3, which Pages runs, replaces its default exclude list with this one,
# and Pages only adds CNAME to the default list. So CNAME and the Jekyll
# defaults are repeated here to keep the output otherwise unchanged.
exclude:
  - "*.md"
  - "*.markdown"
  - "*.mkdown"
  - "*.mkdn"
  - "*.mkd"
  - CNAME
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
